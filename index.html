<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicción Mundial</title>
  <style>
    :root {
      --bg: #0a0e14;
      --accent: #00e07a;
      --text: #e8edf2;
      --muted: #7a8694;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    /* ---------- Pantalla de carga ---------- */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 35%, rgba(0, 224, 122, 0.08), transparent 60%),
        var(--bg);
      transition: opacity 0.8s ease;
      z-index: 10;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    .loading-text.fade {
      opacity: 0;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ---------- Resultado (imagen) ---------- */
    #result {
      opacity: 0;
      transform: scale(0.97);
      transition: opacity 1s ease, transform 1s ease;
      max-width: 100vw;
      max-height: 100dvh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #result.show {
      opacity: 1;
      transform: scale(1);
    }

    #result img {
      max-width: 100%;
      max-height: calc(100dvh - 32px);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Cargando datos...</div>
    <div class="subtitle">Analizando resultados</div>
  </div>

  <div id="result">
    <img src="mont.jpg" alt="Predicción" />
  </div>

  <script>
    window.addEventListener("load", function () {
      var loader = document.getElementById("loader");
      var result = document.getElementById("result");
      var textEl = document.getElementById("loadingText");

      var messages = [
        "Cargando datos...",
        "Por favor espere...",
        "Espere un poco más...",
        "Ya casi..."
      ];

      var step = 1250;     // ms por mensaje -> 4 mensajes ~= 5 segundos
      var fadeMs = 350;    // debe ser >= la transición CSS (0.3s) para que termine antes del swap

      var i = 0;

      function next() {
        i++;

        if (i >= messages.length) {
          loader.classList.add("hidden");
          result.classList.add("show");
          return;
        }

        // 1) desvanecer el mensaje actual
        textEl.classList.add("fade");

        // 2) recién cuando terminó el fade-out, cambiar el texto y volver a aparecer
        setTimeout(function () {
          textEl.textContent = messages[i];
          textEl.classList.remove("fade");
          setTimeout(next, step - fadeMs);
        }, fadeMs);
      }

      textEl.textContent = messages[0];
      setTimeout(next, step);
    });
  </script>
</body>
</html>
